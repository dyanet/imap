name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Issue #22: a Dependabot bump inside examples/gmail-viewer or
    # examples/gmail-viewer-cdk used to run this whole workflow -- including
    # the publish-eligibility job -- even though nothing in the published
    # package changed. Most of the noise in this repo's Actions history is
    # exactly that. Example and documentation changes don't affect the
    # package, so they don't run the package's pipeline.
    paths-ignore:
      - "examples/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "docs/**"
      - "**.md"

# Cancel a superseded run rather than letting an outdated commit and its
# replacement both run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every Node line's real result. With the default (fail-fast:
      # true) the first failure cancels the rest, so a version-specific
      # failure hides whether the others would have passed -- which is the
      # signal a version matrix exists to produce.
      fail-fast: false
      matrix:
        # Every Node line still supported as of August 2026: 22 (Maintenance
        # LTS), 24 (Active LTS), 26 (Current, Active LTS from October 2026).
        # 18 and 20 are EOL; `engines.node` was raised to >=22 to match,
        # because claiming support without CI proof isn't support.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails the build on a known high/critical advisory in anything that
      # ships to users. Dev-only advisories are left to Dependabot so a
      # test-tool CVE can't block a release of unaffected runtime code.
      - name: Audit runtime dependencies
        if: matrix.node-version == 24
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      # Reports badge drift without failing, and deliberately does not
      # commit. Two reasons it can't: this repo's ruleset requires changes
      # to main to go through a pull request, so a push from CI is rejected
      # with GH013; and coverage here moves ~0.5pp between runs because the
      # property tests generate fresh cases each time, so an auto-committing
      # badge would churn indefinitely. Refresh with `npm run coverage:badge`.
      - name: Check coverage badge is current (Node 24 only)
        if: matrix.node-version == 24
        run: |
          node scripts/coverage-badge.mjs
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "coverage badge is current"
          else
            echo "::notice::Coverage moved since the badge was generated. Run \`npm run coverage:badge\` and commit .github/badges/coverage.svg."
            git --no-pager diff --stat -- .github/badges/coverage.svg
          fi

  # Publishing runs only off an explicit `v*` tag, never off every push to
  # main.
  #
  # This is the root cause of most of this repo's CI failure history. The
  # old `publish` job was gated on `github.ref == 'refs/heads/main' &&
  # github.event_name == 'push'`, so it ran on every commit -- but
  # package.json's version only changes at release time, and GitHub
  # Packages rejects re-publishing an existing version. Every push between
  # releases therefore failed on the publish step, which is why 25+ runs in
  # the visible history are red (e.g. run #38, whose only failing step was
  # publish).
  #
  # Tag-gating means a publish happens exactly when someone deliberately
  # cuts a release: bump the version, `git tag vX.Y.Z`, push the tag.
  publish:
    needs: test
    runs-on: ubuntu-latest
    # Releases happen two ways:
    #  - a pushed v* tag (as before), or
    #  - merging a version bump to main: on a push to main this job checks
    #    whether v<package.json version> is already tagged, and does nothing
    #    if it is. So ordinary commits are a no-op (not a red "cannot publish
    #    over" failure), and a PR that bumps the version releases on merge.
    #    The job tags the commit itself afterwards; a tag pushed with
    #    GITHUB_TOKEN does not re-trigger workflows, so there is no double run.
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: write # to tag the release commit
      packages: write
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@v7

      # Registry target is unchanged: this package publishes to GitHub
      # Packages, not npmjs.com, authenticated with the workflow's own
      # GITHUB_TOKEN via `packages: write`.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@dyanet"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Decide whether to release
        id: rel
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$PKG_VERSION" >/dev/null; then
            echo "v$PKG_VERSION is already tagged - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$PKG_VERSION is not tagged yet - releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # `prod:build` runs the unit and property suites before compiling
      # (issue #23). `needs: test` already blocks a broken commit from
      # reaching this job; running them again here means the artifact that
      # actually gets published was built from a tested tree, whichever
      # path led to the publish.
      - name: Build for production (tests then compile)
        if: steps.rel.outputs.release == 'true'
        run: npm run prod:build

      # Both steps check first and skip if that exact version already
      # exists, so re-running a release tag is a no-op rather than a fatal
      # "cannot publish over the previously published versions".
      - name: Publish to GitHub Packages
        if: steps.rel.outputs.release == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on GitHub Packages - skipping."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This package is on npmjs too (0.5.2 and earlier), so a release that
      # only reaches GitHub Packages leaves the two registries drifting.
      #
      # Writes its own npmrc rather than passing --registry: setup-node put
      # `@dyanet:registry=https://npm.pkg.github.com` in the default npmrc,
      # and for a *scoped* package that mapping beats the --registry flag --
      # the same trap sent a tarball to the wrong host in dyanet/iso-date.
      #
      # Stages the release on npmjs through npm Trusted Publishing (OIDC, via
      # `id-token: write`); no token is involved. The trusted publisher for
      # this package allows staging, not direct publishing, so nothing goes
      # live until a maintainer approves it with 2FA: npmjs.com > Staged
      # Packages > Approve, or `npm stage approve <stage-id>`.
      # `npm stage list` needs a logged-in user, so CI can't see what's already
      # staged; the release tag pushed below is what stops a re-stage.
      - name: Stage on npmjs (approve on npmjs.com to publish)
        if: steps.rel.outputs.release == 'true'
        run: |
          npm install -g npm@latest # `npm stage` needs a current npm

          NPMRC="$RUNNER_TEMP/.npmrc-npmjs"
          printf 'registry=https://registry.npmjs.org/\n@dyanet:registry=https://registry.npmjs.org/\n' > "$NPMRC"

          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version --userconfig "$NPMRC" >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published on npmjs - skipping."
          else
            npm stage publish --userconfig "$NPMRC" --access public --provenance
            echo "::notice title=Approve on npmjs::$NAME@$VERSION is staged. Approve it at npmjs.com > Staged Packages (2FA), or run: npm stage approve <stage-id>"
          fi

      - name: Tag the release commit
        if: steps.rel.outputs.release == 'true' && github.ref == 'refs/heads/main'
        run: |
          TAG="v${{ steps.rel.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
